name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q app
      - name: Run tests
        run: python -m unittest discover -s app -p 'test_*.py'

  docker:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag motiva:ci .
      - name: Smoke test container
        run: |
          docker run -d --name motiva-ci -p 8787:8787 motiva:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 2
          done
          docker logs motiva-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f motiva-ci || true

  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
